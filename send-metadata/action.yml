name: 'Agent Metadata Action'
description: 'Fetches agent configuration metadata to create/update NEGP entities in NR'
inputs:
  newrelic-client-id:
    description: 'NewRelic client ID (pass from secrets)'
    required: true
  newrelic-private-key:
    description: 'NewRelic private key content (pass from secrets)'
    required: true
  agent-type:
    description: 'The type of agent eg. NRDotNetAgent'
    required: false
    default: ''
  version:
    description: 'Agent version tag name (ex. v1.2.3). Must match the exact git tag name for checkout.'
    required: false
    default: ''
  git-ref:
    description: 'Git reference to checkout (tag, branch, commit SHA). Use this when the git tag differs from the semantic version. For example, if your git tag is "nr-ebpf-agent-1.2.3" but the version for APIs is "1.2.3", pass git-ref="nr-ebpf-agent-1.2.3" and version="1.2.3". Leave empty to use version parameter for checkout (backwards compatibility).'
    required: false
    default: ''
  config-directory:
    description: 'Directory containing agent configuration files (relative to repository root, default: .fleetControl)'
    required: false
    default: '.fleetControl'
  fetch-depth:
    description: 'Number of commits to fetch (> 1 may be required for docs flow)'
    required: false
    default: '1'
  oci-registry:
    description: 'OCI registry URL for binary uploads (e.g., ghcr.io/newrelic/agents). Leave empty to skip binary upload.'
    required: false
    default: ''
  oci-username:
    description: 'OCI registry username (required if oci-registry is set)'
    required: false
    default: ''
  oci-password:
    description: 'OCI registry password or token (required if oci-registry is set)'
    required: false
    default: ''
  binaries:
    description: 'JSON array with artifact definitions. Each artifact must specify name, path, os, arch, and format. Example: [{"name": "linux-tar", "path": "./dist/agent.tar.gz", "os": "linux", "arch": "amd64", "format": "tar+gzip"}]'
    required: false
    default: ''
  tags:
    description: 'JSON object of arbitrary key/value tags to store on the agent definition entity, e.g. {"helm-version": "1.7.10", "cd-helm-version": "1.0.0"}. Each value must be a string.'
    required: false
    default: ''
  bindings-override:
    description: >
      JSON array of binding objects to merge into the bindings loaded from agentDefinition.yml.
      Each override binding is matched against existing bindings by (type, targetType, target) -
      a match replaces the existing entry, no match appends. Useful for binding values that must
      be computed at release time (e.g. a protocol version read from the repo's build metadata)
      rather than hardcoded in agentDefinition.yml.
      Example: [{"type":"SUPPORTS","targetType":"SPECIFICATION","target":"protocol_version","versions":["<=1.0"]}]
    required: false
    default: ''
  monitoring-type:
    description: 'Monitoring type indicating which fleet this agent belongs to (APM or INFRA). Leave empty to use the service default mapping.'
    required: false
    default: ''
  display-name:
    description: 'Human-readable display name for this agent.'
    required: false
    default: ''
  validate-agent-type:
    description: 'Validate the agent type definition (.fleetControl/agentControlDefinitions.yml content file) via newrelic-agent-control-cli before sending metadata. Opt-in per repo; fails the action if the definition is invalid. Requires Docker on the runner.'
    required: false
    default: 'false'
  agent-control-cli-tag:
    description: 'Tag of the newrelic/newrelic-agent-control-cli Docker image to use for validate-agent-type.'
    required: false
    default: 'latest'
  cache:
    description: 'Enable Go build cache'
    required: false
    default: 'true'
  apm-control-nr-license-key:
    description: 'Deprecated: use newrelic-license-key instead.'
    required: false
    default: ''
  newrelic-license-key:
    description: 'New Relic APM license key for instrumentation of this action (optional, pass from secrets). Get this key from the team that owns this action'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Set up Go first so the failure reporter can build for any later step's failure.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '${{ github.action_path }}/../go.mod'
        cache: ${{ inputs.cache }}
        cache-dependency-path: '${{ github.action_path }}/../go.sum'

    - name: Determine checkout ref
      id: checkout-ref
      shell: bash
      run: |
        GIT_REF="${{ inputs.git-ref }}"
        VERSION="${{ inputs.version }}"

        # If git-ref is explicitly provided, use it
        if [ -n "$GIT_REF" ]; then
          echo "ref=$GIT_REF" >> $GITHUB_OUTPUT
          echo "Using git-ref: $GIT_REF"
        # If git-ref not provided, fall back to version for backwards compatibility
        elif [ -n "$VERSION" ]; then
          echo "ref=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version for checkout (backwards compatibility): $VERSION"
        # If both empty, use default (checkout triggering commit for docs flow)
        else
          echo "ref=" >> $GITHUB_OUTPUT
          echo "No ref specified, using triggering commit"
        fi

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ steps.checkout-ref.outputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '${{ github.action_path }}/../go.mod'
        cache: ${{ inputs.cache }}
        cache-dependency-path: '${{ github.action_path }}/../go.sum'

    # Self-repository reference: resolves to the auth action at the exact commit
    # this action is running at, so it always matches whatever ref/SHA the
    # caller pinned - no separate ref to go stale.
    - name: Authenticate with NewRelic
      id: newrelic-auth
      uses: $/.github/actions/newrelic-auth
      with:
        newrelic-client-id: ${{ inputs.newrelic-client-id }}
        newrelic-private-key: ${{ inputs.newrelic-private-key }}

    # Kept ahead of "Build and Run" so the binary's own error reporting doesn't double up.
    - name: Report failure to New Relic
      if: failure()
      shell: bash
      env:
        NEWRELIC_LICENSE_KEY: ${{ inputs.newrelic-license-key || inputs.apm-control-nr-license-key }}
      run: |
        cd ${{ github.action_path }}/..
        if ! go build -o notify-failure ./cmd/notify-failure; then
          echo "::warning::Could not build failure reporter; skipping New Relic failure report"
          exit 0
        fi
        ./notify-failure

    - name: Build and Run
      id: run-action
      shell: bash
      env:
        INPUT_AGENT_TYPE: ${{ inputs.agent-type }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CONFIG_DIRECTORY: ${{ inputs.config-directory }}
        INPUT_MONITORING_TYPE: ${{ inputs.monitoring-type }}
        INPUT_DISPLAY_NAME: ${{ inputs.display-name }}
        NEWRELIC_TOKEN: ${{ steps.newrelic-auth.outputs.token }}
        INPUT_OCI_REGISTRY: ${{ inputs.oci-registry }}
        INPUT_OCI_USERNAME: ${{ inputs.oci-username }}
        INPUT_OCI_PASSWORD: ${{ inputs.oci-password }}
        INPUT_BINARIES: ${{ inputs.binaries }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_BINDINGS_OVERRIDE: ${{ inputs.bindings-override }}
        INPUT_VALIDATE_AGENT_TYPE: ${{ inputs.validate-agent-type }}
        INPUT_AGENT_CONTROL_CLI_TAG: ${{ inputs.agent-control-cli-tag }}
        NEWRELIC_LICENSE_KEY: ${{ inputs.newrelic-license-key || inputs.apm-control-nr-license-key }}
      run: |
        set -e
        cd ${{ github.action_path }}/..
        # todo - look at using a built image instead
        go build -o agent-metadata-action ./cmd/agent-metadata-action
        ./agent-metadata-action

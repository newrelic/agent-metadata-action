name: 'Agent Metadata Action'
description: 'Fetches agent configuration metadata to create/update NEGP entities in NR'
inputs:
  newrelic-client-id:
    description: 'NewRelic client ID (pass from secrets)'
    required: true
  newrelic-private-key:
    description: 'NewRelic private key content (pass from secrets)'
    required: true
  agent-type:
    description: 'The type of agent eg. NRDotNetAgent'
    required: false
    default: ''
  version:
    description: 'Agent version tag name (ex. v1.2.3). Must match the exact git tag name for checkout.'
    required: false
    default: ''
  git-ref:
    description: 'Git reference to checkout (tag, branch, commit SHA). Use this when the git tag differs from the semantic version. For example, if your git tag is "nr-ebpf-agent-1.2.3" but the version for APIs is "1.2.3", pass git-ref="nr-ebpf-agent-1.2.3" and version="1.2.3". Leave empty to use version parameter for checkout (backwards compatibility).'
    required: false
    default: ''
  config-directory:
    description: 'Directory containing agent configuration files (relative to repository root, default: .fleetControl)'
    required: false
    default: '.fleetControl'
  fetch-depth:
    description: 'Number of commits to fetch (> 1 may be required for docs flow)'
    required: false
    default: '1'
  oci-registry:
    description: 'OCI registry URL for binary uploads (e.g., ghcr.io/newrelic/agents). Leave empty to skip binary upload.'
    required: false
    default: ''
  oci-username:
    description: 'OCI registry username (required if oci-registry is set)'
    required: false
    default: ''
  oci-password:
    description: 'OCI registry password or token (required if oci-registry is set)'
    required: false
    default: ''
  binaries:
    description: 'JSON array with artifact definitions. Each artifact must specify name, path, os, arch, and format. Example: [{"name": "linux-tar", "path": "./dist/agent.tar.gz", "os": "linux", "arch": "amd64", "format": "tar+gzip"}]'
    required: false
    default: ''
  tags:
    description: 'JSON object of arbitrary key/value tags to store on the agent definition entity, e.g. {"helm-version": "1.7.10", "cd-helm-version": "1.0.0"}. Each value must be a string.'
    required: false
    default: ''
  bindings-override:
    description: >
      JSON array of binding objects to merge into the bindings loaded from agentDefinition.yml.
      Each override binding is matched against existing bindings by (type, targetType, target) -
      a match replaces the existing entry, no match appends. Useful for binding values that must
      be computed at release time (e.g. a protocol version read from the repo's build metadata)
      rather than hardcoded in agentDefinition.yml.
      Example: [{"type":"SUPPORTS","targetType":"SPECIFICATION","target":"protocol_version","versions":["<=1.0"]}]
    required: false
    default: ''
  monitoring-type:
    description: 'Monitoring type indicating which fleet this agent belongs to (APM or INFRA). Leave empty to use the service default mapping.'
    required: false
    default: ''
  display-name:
    description: 'Human-readable display name for this agent.'
    required: false
    default: ''
  validate-agent-type:
    description: 'Validate the agent type definition (.fleetControl/agentControlDefinitions.yml content file) via newrelic-agent-control-cli before sending metadata. Opt-in per repo; fails the action if the definition is invalid. Requires Docker on the runner.'
    required: false
    default: 'false'
  agent-control-cli-tag:
    description: 'Tag of the newrelic/newrelic-agent-control-cli Docker image to use for validate-agent-type.'
    required: false
    default: 'latest'
  cache:
    description: 'Enable Go build cache'
    required: false
    default: 'true'
  apm-control-nr-license-key:
    description: 'New Relic APM license key for instrumentation of this action (optional, pass from secrets)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Kept first so it always fires, regardless of what happens downstream.
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning::newrelic/agent-metadata-action@v1 (root path) is deprecated. Please migrate to newrelic/agent-metadata-action/send-metadata@v1 - same inputs, same behavior. The root action will be removed in a future release."

    # Delegates to the send-metadata subdirectory action so the root keeps working
    # without duplicating its steps. Pinned to a commit SHA rather than a tag: no
    # tag yet exists containing send-metadata/, and a SHA lets us pin to it
    # immediately without waiting for a release. This intentionally freezes the
    # root action's behavior at this commit - it's deprecated and won't otherwise
    # track future send-metadata changes unless this pin is bumped deliberately.
    - name: Delegate to send-metadata
      uses: newrelic/agent-metadata-action/send-metadata@cf20d3d6b787802b405abb5174956308ae93c0fb
      with:
        newrelic-client-id: ${{ inputs.newrelic-client-id }}
        newrelic-private-key: ${{ inputs.newrelic-private-key }}
        agent-type: ${{ inputs.agent-type }}
        version: ${{ inputs.version }}
        git-ref: ${{ inputs.git-ref }}
        config-directory: ${{ inputs.config-directory }}
        fetch-depth: ${{ inputs.fetch-depth }}
        oci-registry: ${{ inputs.oci-registry }}
        oci-username: ${{ inputs.oci-username }}
        oci-password: ${{ inputs.oci-password }}
        binaries: ${{ inputs.binaries }}
        tags: ${{ inputs.tags }}
        bindings-override: ${{ inputs.bindings-override }}
        monitoring-type: ${{ inputs.monitoring-type }}
        display-name: ${{ inputs.display-name }}
        validate-agent-type: ${{ inputs.validate-agent-type }}
        agent-control-cli-tag: ${{ inputs.agent-control-cli-tag }}
        cache: ${{ inputs.cache }}
        apm-control-nr-license-key: ${{ inputs.apm-control-nr-license-key }}

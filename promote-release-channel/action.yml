name: 'Promote Agent Version To Release Channel'
description: 'Calls the New Relic instrumentation service to promote an already-published agent version onto a release channel (e.g. REGULAR, STABLE).'
inputs:
  newrelic-client-id:
    description: 'NewRelic client ID (pass from secrets)'
    required: true
  newrelic-private-key:
    description: 'NewRelic private key content (pass from secrets)'
    required: true
  agent-type:
    description: 'The type of agent eg. NRDotNetAgent'
    required: true
  version:
    description: 'Agent version to promote (e.g. 1.2.3). Must already be published to instrumentation-metadata - this is not a git ref and no checkout occurs.'
    required: true
  channel:
    description: 'Release channel to promote the version to. One of EXPERIMENTAL, RAPID, REGULAR, STABLE, EXTENDED.'
    required: true
  platform:
    description: 'Target platform for the promotion. One of: HOST, KUBERNETESCLUSTER'
    required: true
  operating-system:
    description: 'Target operating system for the promotion. Required when platform is HOST. One of: LINUX, WINDOWS'
    required: false
    default: ''
  note:
    description: 'Optional note describing why this promotion was made (audit trail only, not persisted).'
    required: false
    default: ''
  cache:
    description: 'Enable Go build cache'
    required: false
    default: 'true'
  apm-control-nr-license-key:
    description: 'Deprecated: use newrelic-license-key instead.'
    required: false
    default: ''
  newrelic-license-key:
    description: 'New Relic APM license key for instrumentation of this action (optional, pass from secrets). Get this key from the team that owns this action'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '${{ github.action_path }}/../go.mod'
        cache: ${{ inputs.cache }}
        cache-dependency-path: '${{ github.action_path }}/../go.sum'

    # Self-repository reference: resolves to the auth action at the exact commit
    # this action is running at, so it always matches whatever ref/SHA the
    # caller pinned - no separate ref to go stale.
    - name: Authenticate with NewRelic
      id: newrelic-auth
      uses: $/.github/actions/newrelic-auth
      with:
        newrelic-client-id: ${{ inputs.newrelic-client-id }}
        newrelic-private-key: ${{ inputs.newrelic-private-key }}

    # Kept ahead of "Build and Run" so the binary's own error reporting doesn't double up.
    - name: Report failure to New Relic
      if: failure()
      shell: bash
      env:
        NEWRELIC_LICENSE_KEY: ${{ inputs.newrelic-license-key || inputs.apm-control-nr-license-key }}
      run: |
        cd ${{ github.action_path }}/..
        if ! go build -o notify-failure ./cmd/notify-failure; then
          echo "::warning::Could not build failure reporter; skipping New Relic failure report"
          exit 0
        fi
        ./notify-failure

    - name: Build and Run
      id: run-action
      shell: bash
      env:
        INPUT_AGENT_TYPE: ${{ inputs.agent-type }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_OPERATING_SYSTEM: ${{ inputs.operating-system }}
        INPUT_NOTE: ${{ inputs.note }}
        NEWRELIC_TOKEN: ${{ steps.newrelic-auth.outputs.token }}
        NEWRELIC_LICENSE_KEY: ${{ inputs.newrelic-license-key || inputs.apm-control-nr-license-key }}
      run: |
        set -e
        cd ${{ github.action_path }}/..
        # Output name deliberately differs from the ./promote-release-channel/ action
        # directory at repo root - `go build -o promote-release-channel` would silently
        # write the binary *inside* that existing directory instead of erroring.
        go build -o promote-release-channel-bin ./cmd/promote-release-channel
        ./promote-release-channel-bin

name: 'Disable Agent Version'
description: 'Calls the New Relic instrumentation service to disable (soft-delete) an already-published agent version so it is no longer returned to consumers.'
inputs:
  newrelic-client-id:
    description: 'NewRelic client ID (pass from secrets)'
    required: true
  newrelic-private-key:
    description: 'NewRelic private key content (pass from secrets)'
    required: true
  agent-type:
    description: 'The type of agent eg. NRDotNetAgent'
    required: true
  version:
    description: 'Agent version to disable (e.g. 1.2.3). Must already be published to instrumentation-metadata - this is not a git ref and no checkout occurs.'
    required: true
  cache:
    description: 'Enable Go build cache'
    required: false
    default: 'true'
  newrelic-license-key:
    description: 'New Relic APM license key for instrumentation of this action (optional, pass from secrets). Get this key from the team that owns this action'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '${{ github.action_path }}/../go.mod'
        cache: ${{ inputs.cache }}
        cache-dependency-path: '${{ github.action_path }}/../go.sum'

    # Self-repository reference: resolves to the auth action at the exact commit
    # this action is running at, so it always matches whatever ref/SHA the
    # caller pinned - no separate ref to go stale.
    - name: Authenticate with NewRelic
      id: newrelic-auth
      uses: $/.github/actions/newrelic-auth
      with:
        newrelic-client-id: ${{ inputs.newrelic-client-id }}
        newrelic-private-key: ${{ inputs.newrelic-private-key }}

    # Kept ahead of "Build and Run" so the binary's own error reporting doesn't double up.
    - name: Report failure to New Relic
      if: failure()
      shell: bash
      env:
        NEWRELIC_LICENSE_KEY: ${{ inputs.newrelic-license-key }}
      run: |
        cd ${{ github.action_path }}/..
        if ! go build -o notify-failure ./cmd/notify-failure; then
          echo "::warning::Could not build failure reporter; skipping New Relic failure report"
          exit 0
        fi
        ./notify-failure

    - name: Build and Run
      id: run-action
      shell: bash
      env:
        INPUT_AGENT_TYPE: ${{ inputs.agent-type }}
        INPUT_VERSION: ${{ inputs.version }}
        NEWRELIC_TOKEN: ${{ steps.newrelic-auth.outputs.token }}
        NEWRELIC_LICENSE_KEY: ${{ inputs.newrelic-license-key }}
      run: |
        set -e
        cd ${{ github.action_path }}/..
        # Output name deliberately differs from the ./disable-agent/ action
        # directory at repo root - `go build -o disable-agent` would silently
        # write the binary *inside* that existing directory instead of erroring.
        go build -o disable-agent-bin ./cmd/disable-agent
        ./disable-agent-bin
